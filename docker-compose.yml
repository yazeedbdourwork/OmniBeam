# OmniBeam with Docker Compose:  docker compose up -d   then open http://localhost:3000
# For phones and other computers you need HTTPS (browsers only allow WebRTC and the camera on https://).
# See SELF-HOSTING.md for a Caddy example that gets a certificate for you.
services:
  omnibeam:
    build: .
    # image: ghcr.io/yazeedbdourwork/omnibeam:latest   # use this line instead of "build" once an image is published
    container_name: omnibeam
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - omnibeam-data:/data
    environment:
      # The address people open, used in share links, QR codes and the sitemap
      SITE_URL: "http://localhost:3000"
      # A long random password for the owner pages /stats and /status (empty = those pages are off)
      STATS_KEY: ""
      # A TURN server helps when two devices can't reach each other directly (phone data, strict routers).
      # Without it, OmniBeam falls back to relaying through this server, which also works.
      # TURN_URL: "turn:turn.example.com:3478,turns:turn.example.com:443"
      # TURN_USERNAME: ""
      # TURN_CREDENTIAL: ""

volumes:
  omnibeam-data:
