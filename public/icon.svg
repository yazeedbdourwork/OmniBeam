<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Transparent Background -->
  <g transform="translate(256, 256) skewX(-10) translate(-256, -256)">
    
    <!-- Speed / Motion Trail Lines -->
    <g stroke-linecap="round">
      <line x1="36" y1="168" x2="108" y2="168" stroke="#736EFE" stroke-width="10" />
      <line x1="56" y1="198" x2="88" y2="198" stroke="#3A4154" stroke-width="6" opacity="0.6" />
      <line x1="20" y1="228" x2="78" y2="228" stroke="#736EFE" stroke-width="12" />
      <line x1="48" y1="258" x2="76" y2="258" stroke="#3A4154" stroke-width="8" opacity="0.8" />
      <line x1="28" y1="288" x2="80" y2="288" stroke="#736EFE" stroke-width="10" />
      <line x1="60" y1="318" x2="94" y2="318" stroke="#3A4154" stroke-width="6" opacity="0.6" />
      <line x1="40" y1="348" x2="112" y2="348" stroke="#736EFE" stroke-width="10" />
    </g>

    <!-- Letter 'O' ("Omni" Dark Slate #3A4154) -->
    <rect x="104" y="148" width="144" height="216" rx="72" fill="none" stroke="#3A4154" stroke-width="36" />

    <!-- Letter 'B' ("Beam" Indigo #736EFE) -->
    <path d="M 296 148 H 376 A 54 54 0 0 1 376 256 H 296 Z" fill="none" stroke="#736EFE" stroke-width="36" stroke-linejoin="round" />
    <path d="M 296 256 H 388 A 54 54 0 0 1 388 364 H 296 Z" fill="none" stroke="#736EFE" stroke-width="36" stroke-linejoin="round" />
    <line x1="296" y1="148" x2="296" y2="364" stroke="#736EFE" stroke-width="36" stroke-linecap="round" />

    <!-- Central Omni-Beam / Lightning Bolt -->
    <polygon points="326,76 196,268 264,268 210,436 346,244 276,244" fill="#736EFE" stroke="#EAECF3" stroke-width="10" stroke-linejoin="round" />
    <polygon points="326,76 196,268 264,268 210,436 346,244 276,244" fill="#5B54FA" />
  </g>
</svg>